name: Comprehensive CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  FORCE_COLOR: 1
  KMP_DUPLICATE_LIB_OK: TRUE
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

jobs:
  pre-commit:
    name: Pre-commit (fail fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install "pre-commit>=4,<5"
      - name: Run pre-commit (all files)
        env:
          # Pyright runs in code-quality via Pixi; this job has no pixi on PATH.
          SKIP: pyright
        run: pre-commit run --all-files --show-diff-on-failure --color always

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: latest

      - name: Install Pixi env (test — pyright + built package)
        run: pixi install --frozen -e test

      # Ruff is enforced in the pre-commit job; this job focuses on typecheck.
      - name: Pyright (scoped allowlist in pyrightconfig.json)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pixi run -e test -- pyright --verbose

  build-test:
    name: Build & Test
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: latest

      - name: Install test environment
        run: pixi install --frozen -e test

      - name: Build editable torchsky (C++ extension)
        run: pixi run -e test -- pip install -e . --no-build-isolation

      - name: Run full test suite
        run: pixi run -e test -- pytest -n auto -v --tb=short --ignore-glob="tests/test_map_*.py"

  map-mosaic-bench:
    name: Map mosaic (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: pre-commit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: fundamentals
            tests: >-
              tests/test_map_adjoints.py
              tests/test_map_background_ops.py
              tests/test_map_fft_affine_ldu.py
              tests/test_map_fft_resample.py
              tests/test_map_image_plane.py
              tests/test_map_operator_bundle.py
              tests/test_map_operator_execution.py
              tests/test_map_periodic_affine.py
              tests/test_map_product.py
              tests/test_map_solvers.py
          - shard: field
            tests: >-
              tests/test_map_field.py
              tests/test_map_field_fit.py
              tests/test_map_field_render_scale.py
              tests/test_map_field_strainer.py
              tests/test_map_learned_ops.py
              tests/test_map_scene_representations.py
              tests/test_map_sky.py
              tests/test_map_sky_corrector.py
              tests/test_map_sky_polynomial.py
              tests/test_map_smacs0723_field_fit.py
              tests/test_map_smacs0723_field_fit_band_sweep.py
              tests/test_map_smacs0723_field_fit_joint.py
              tests/test_map_smacs0723_real.py
              tests/test_map_smacs0723_reproduce.py
              tests/test_map_smacs0723_stackers.py
              tests/test_map_smacs0723_stackers_band_sweep.py
              tests/test_map_target_render_spec.py
          - shard: integration
            tests: >-
              tests/test_map_compat_bench.py
              tests/test_map_conservative_external_parity.py
              tests/test_map_dfreproject_parity.py
              tests/test_map_drizzle_external_parity.py
              tests/test_map_external_tools_smoke.py
              tests/test_map_ground_truth.py
              tests/test_map_healpix_coadd_bridge_smoke.py
              tests/test_map_healpix_native_tan.py
              tests/test_map_megapipe_scale.py
              tests/test_map_multifield_truth.py
              tests/test_map_radio_fixture.py
              tests/test_map_radio_smoke.py
              tests/test_map_reproject_fft_parity.py
              tests/test_map_spectral_affine.py
              tests/test_map_spectral_nonuniform.py
              tests/test_map_spectral_nufft.py
              tests/test_map_sphere_sh_map_smoke.py
              tests/test_map_swarp_optional_parity.py
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: latest

      - name: Install sphere-bench environment
        run: pixi install --frozen -e sphere-bench

      - name: Build editable torchsky (C++ extension)
        run: pixi run -e sphere-bench -- pip install -e . --no-build-isolation

      - name: Run map pytest (includes reproject + drizzle smoke)
        run: pixi run -e sphere-bench -- pytest -n auto -q --tb=short ${{ matrix.tests }}

      - name: Map compat gate vs baseline (synthetic_shifted_wcs)
        if: matrix.shard == 'integration'
        run: |
          pixi run -e sphere-bench -- env PYTHONPATH=src:benchmarks python benchmarks/bench_map_compat.py \
            --size 32 --n-obs 2 --runs 1 \
            --cases synthetic_shifted_wcs \
            --torchsky-kernels bilinear \
            --reproject-kernels bilinear \
            --drizzle-kernels point \
            --swarp-kernels bilinear \
            --json-out benchmark_results/map_compat_ci.json \
            --baseline-json benchmarks/baselines/map_compat_ci_gate.json

      - name: Bench smoke — fft_shift on CRPIX translation case
        if: matrix.shard == 'integration'
        run: |
          pixi run -e sphere-bench -- env PYTHONPATH=src:benchmarks python benchmarks/bench_map_compat.py \
            --size 32 --n-obs 2 --runs 1 \
            --cases upstream_drizzle_crpix_translation \
            --torchsky-kernels fft_shift \
            --reproject-kernels bilinear \
            --drizzle-kernels point \
            --swarp-kernels bilinear \
            --json-out benchmark_results/map_compat_fft_shift_smoke.json

      - name: Bench smoke — Strainer phase2 synthetic harness
        if: matrix.shard == 'integration'
        run: |
          pixi run -e sphere-bench -- env PYTHONPATH=src:benchmarks python benchmarks/bench_strainer_phase2.py \
            --fit-steps 12 --synthetic-pretrain-steps 24 \
            --early-steps 1,4,8,12

      - name: Bench smoke — SMACS Strainer transfer (ok or skipped without data)
        if: matrix.shard == 'integration'
        run: |
          pixi run -e sphere-bench -- env PYTHONPATH=src:benchmarks python benchmarks/bench_map_smacs0723_strainer_transfer.py \
            --steps 4 --synthetic-pretrain-steps 8
