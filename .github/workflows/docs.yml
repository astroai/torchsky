name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
      - name: Install docs environment
        run: pixi install --frozen -e docs
      - name: Install test environment
        run: pixi install --frozen -e test
      - name: Docs contract (strict build, links, anchors, generated pages, snippets, tests)
        run: pixi run docs-contract
      # Pages exists only on astroai/torchsky; forks still run the docs contract.
      - if: github.repository == 'astroai/torchsky'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - if: github.repository == 'astroai/torchsky'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.repository == 'astroai/torchsky'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
