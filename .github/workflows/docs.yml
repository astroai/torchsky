name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
      - name: Install docs environment
        run: pixi install --frozen -e docs
      - name: Install test environment
        run: pixi install --frozen -e test
      - name: Docs contract (strict build, links, anchors, generated pages, snippets, tests)
        run: pixi run docs-contract
      # Pages exists only on astroai/torchsky; forks still run the docs contract.
      - if: github.repository == 'astroai/torchsky'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - if: github.repository == 'astroai/torchsky'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.repository == 'astroai/torchsky'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
