name: Publish to PyPI

# Tag-driven release: push a `v*` tag on the release commit, after the release
# gates in torchsky-harness have passed for that exact commit.
'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine scikit-build-core nanobind numpy
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Build sdist and wheel
        run: python -m build --no-isolation
      - name: Verify distributions
        run: |
          python scripts/check_distribution.py --wheel dist/*.whl --sdist dist/*.tar.gz
          python - <<'PY'
          import glob
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = "${{ github.ref_name }}"
          assert tag == f"v{version}", f"tag {tag} does not match version {version}"
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          assert version in wheels[0], (version, wheels[0])
          print("distributions:", wheels[0], sdists[0], "version:", version)
          PY
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python scripts/smoke_installed_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchsky
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
