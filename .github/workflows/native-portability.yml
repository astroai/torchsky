name: Native Portability

'on':
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native-sanitizers:
    name: Linux native ASan and UBSan contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -O1
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install sanitized build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'nanobind>=2.10.2' 'numpy>=1.20' 'pytest>=8' 'scikit-build-core>=1.0.0' 'torchfits>=1.3.1'
      - name: Build sanitized native extension
        run: python -m pip install -e . --no-build-isolation
      - name: Run native safety contracts
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          python -m pytest -q tests/test_cpp_dispatcher.py tests/test_cpp_fixed_dispatcher.py tests/test_cpp_spectral_dispatcher.py tests/test_cpp_wcs_safety.py

  linux-x86-native:
    name: Linux x86-64 baseline and AVX2/FMA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKBUILD_BUILD_DIR: build/native-portability
    steps:
      - uses: actions/checkout@v4
      - name: Install native inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils build-essential ninja-build qemu-user
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'build>=1,<2' 'nanobind>=2.10.2' 'numpy>=1.20' 'pytest>=8' 'scikit-build-core>=1.0.0' 'torchfits>=1.3.1' 'twine>=5'
          python -c "import torch; assert torch.version.cuda is None, torch.version.cuda"
      - name: Configure and build CPU-only native wheel
        run: python -m build --wheel --no-isolation --outdir wheelhouse
      - name: Inspect and install wheel
        run: |
          python scripts/check_distribution.py --wheel wheelhouse/*.whl
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
          python scripts/smoke_installed_wheel.py
      - name: Invoke forced AVX2/FMA and compare with scalar
        run: |
          python - <<'PY'
          flags = open('/proc/cpuinfo', encoding='utf-8').read().lower()
          assert ' avx2 ' in f' {flags} ' and ' fma ' in f' {flags} ', 'hosted CPU lacks AVX2/FMA'
          PY
          python scripts/validate_native_runtime.py compare --candidate-isa avx2 --expected-candidate-isa avx2+fma
          python scripts/validate_native_runtime.py reject --isa neon
      - name: Inspect scalar leaf for baseline instructions
        run: |
          scalar_object="$(find build/native-portability -name '*ishioka_scalar.cpp.o' -print -quit)"
          test -n "$scalar_object"
          python scripts/validate_native_runtime.py inspect-scalar-object "$scalar_object"
      - name: Invoke wheel under emulated pre-AVX x86-64 CPU
        run: |
          python_path="$(python -c 'import sys; print(sys.executable)')"
          TORCHSKY_CPU_ISA=auto qemu-x86_64 -cpu Nehalem "$python_path" scripts/validate_native_runtime.py probe --expected-isa scalar

  macos-arm64-native:
    name: macOS arm64 NEON and scalar
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CMAKE_ARGS: -DTORCHSKY_ENABLE_IPO=OFF
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Require hosted arm64 and install build dependencies
        run: |
          test "$(uname -m)" = arm64
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.14.0'
          python -m pip install 'build>=1,<2' 'nanobind>=2.10.2' 'numpy>=1.20' 'scikit-build-core>=1.0.0' 'torchfits>=1.3.1' 'twine>=5'
          python -c "import platform, torch; assert platform.machine() == 'arm64'; assert torch.version.cuda is None"
      - name: Build, inspect, and install arm64 wheel
        run: |
          python -m build --wheel --no-isolation --outdir wheelhouse
          python scripts/check_distribution.py --wheel wheelhouse/*.whl
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
          python scripts/smoke_installed_wheel.py
      - name: Invoke forced NEON and compare with scalar
        run: |
          python scripts/validate_native_runtime.py compare --candidate-isa neon --expected-candidate-isa neon
          python scripts/validate_native_runtime.py reject --isa avx2

  linux-cuda-torch-native:
    name: Linux CUDA-enabled PyTorch native build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CUDA_HOME: ${{ github.workspace }}/.pixi/envs/cuda-bench
      CUDAToolkit_ROOT: ${{ github.workspace }}/.pixi/envs/cuda-bench
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: latest
          cache: true
          run-install: false
      - name: Provision locked CUDA-enabled PyTorch and full toolkit
        run: pixi install --frozen -e cuda-bench
      - name: Diagnose CUDA-enabled TorchConfig inputs
        run: pixi run -e cuda-bench -- python scripts/diagnose_cuda_build.py --require-cuda-torch
      - name: Configure and build native extension against CUDA-enabled PyTorch
        run: pixi run -e cuda-bench -- python -m pip install -e . --no-build-isolation -v
      - name: Invoke CPU native dispatchers linked to CUDA-enabled PyTorch
        run: pixi run -e cuda-bench -- python scripts/validate_native_runtime.py compare --candidate-isa native
      - name: Record hosted CUDA execution limitation
        run: echo '::notice::Standard GitHub-hosted runners have no NVIDIA GPU; this job validates full-toolkit TorchConfig configure/link and invokes torchsky CPU native dispatchers against CUDA-enabled PyTorch.'
