name: Map compat weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  CONDA_OVERRIDE_CUDA: "12.0"
  FORCE_COLOR: 1
  KMP_DUPLICATE_LIB_OK: TRUE
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

jobs:
  map-mosaic-bench-weekly:
    name: Map mosaic bench + compat gate (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: latest

      - name: Install sphere-bench environment
        run: pixi install --frozen -e sphere-bench

      - name: Build editable torchsky (C++ extension)
        run: pixi run -e sphere-bench -- pip install -e . --no-build-isolation

      - name: Run full pytest
        run: pixi run -e sphere-bench -- pytest tests/ -q --tb=short

      - name: Map compat gate vs baseline
        run: |
          pixi run -e sphere-bench -- env PYTHONPATH=src:benchmarks python benchmarks/bench_map_compat.py \
            --size 32 --n-obs 2 --runs 1 \
            --cases synthetic_shifted_wcs \
            --torchsky-kernels bilinear \
            --reproject-kernels bilinear \
            --drizzle-kernels point \
            --swarp-kernels bilinear \
            --json-out benchmark_results/map_compat_weekly.json \
            --baseline-json benchmarks/baselines/map_compat_ci_gate.json
