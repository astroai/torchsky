name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_release:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate version sources and tag
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          pixi = tomllib.loads(Path("pixi.toml").read_text())["package"]["version"]
          module = ast.parse(Path("src/torchsky/__init__.py").read_text())
          runtime = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          assert pyproject == pixi == runtime, (pyproject, pixi, runtime)
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              tag = os.environ["GITHUB_REF_NAME"]
              assert tag == f"v{pyproject}", f"tag {tag} does not match version {pyproject}"
          print("release version:", pyproject)
          PY

  tests:
    name: Tests (Ubuntu, Python ${{ matrix.python-version }})
    needs: validate_release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            pixi-environment: test-py312
          - python-version: '3.13'
            pixi-environment: test-py313
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
      - name: Install exact test environment
        run: pixi install --frozen -e ${{ matrix.pixi-environment }}
      - name: Build exact release candidate
        run: pixi run -e ${{ matrix.pixi-environment }} -- pip install -e . --no-build-isolation
      - name: Verify interpreter and run retained non-map suite
        run: |
          pixi run -e ${{ matrix.pixi-environment }} -- python -c 'import platform; assert platform.python_version().startswith("${{ matrix.python-version }}.")'
          pixi run -e ${{ matrix.pixi-environment }} -- pytest -n auto -q --maxfail=1 --ignore-glob='tests/test_map_*.py'

  map_tests:
    name: Complete map suite (Ubuntu, Python 3.13)
    needs: validate_release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
      - name: Install and build exact release candidate
        run: |
          pixi install --frozen -e test-py313
          pixi run -e test-py313 -- pip install -e . --no-build-isolation
      - name: Run every retained map test
        run: pixi run -e test-py313 -- pytest -n auto -q --maxfail=1 tests/test_map_*.py

  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    needs: [tests, map_tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    env:
      CIBW_BUILD: cp312-* cp313-*
      CIBW_SKIP: pp* *-musllinux_* *-manylinux_i686 *-win32
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_TEST_REQUIRES: pytest
      CIBW_TEST_SOURCES: scripts/smoke_installed_wheel.py
      CIBW_TEST_COMMAND: python {project}/scripts/smoke_installed_wheel.py
      CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
      CIBW_BEFORE_BUILD: "python -m pip install --only-binary=:all: 'scikit-build-core>=1.0.0' 'nanobind>=2.10.2' 'numpy>=2.1,<2.4' 'torch==2.14.0'"
      CIBW_ENVIRONMENT_LINUX: PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --exclude libtorch_python.so --exclude libtorch_cpu.so --exclude libtorch.so --exclude libc10.so -w {dest_dir} {wheel}"
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} --ignore-missing-dependencies --exclude libtorch_python.dylib --exclude libtorch_cpu.dylib --exclude libtorch.dylib --exclude libc10.dylib --exclude libshm.dylib --exclude libasiodrv.dylib"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build wheels
        uses: pypa/cibuildwheel@9fcee9dd00ea649310eaae4735325d2b417226ae

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Check wheel contents and linkage
        run: |
          python -m pip install twine
          for wheel in wheelhouse/*.whl; do
            python scripts/check_distribution.py --wheel "$wheel"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: [tests, map_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install build twine
          python -m build --sdist

      - name: Check source distribution
        run: python scripts/check_distribution.py --sdist dist/*.tar.gz

      - name: Build and smoke-test from source distribution
        run: |
          python -m venv /tmp/torchsky-sdist-smoke
          /tmp/torchsky-sdist-smoke/bin/python -m pip install --upgrade pip
          /tmp/torchsky-sdist-smoke/bin/python -m pip install --only-binary=:all: --extra-index-url https://download.pytorch.org/whl/cpu 'scikit-build-core>=1.0.0' 'nanobind>=2.10.2' 'numpy>=2.1,<2.4' 'torch==2.14.0' 'torchfits>=1.3.1'
          /tmp/torchsky-sdist-smoke/bin/python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/torchsky-sdist-wheel dist/*.tar.gz
          /tmp/torchsky-sdist-smoke/bin/python -m pip install --no-deps /tmp/torchsky-sdist-wheel/*.whl
          /tmp/torchsky-sdist-smoke/bin/python scripts/smoke_installed_wheel.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -R dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist
          verbose: true

  github_release:
    name: Create GitHub Release
    needs: upload_pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          generate_release_notes: true
