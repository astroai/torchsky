[workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = [
    "osx-arm64",
    "linux-64",
    { name = "linux-64-cuda", platform = "linux-64", cuda = "13.0" },
]

[package]
name = "torchsky"
version = "0.4.0"
description = "Torch-native sky data, coordinates, geometry, and mapmaking"
authors = ["Seb Fabbro <sebfabbro@gmail.com>"]

[package.build]
backend = { name = "pixi-build-cmake", version = "*"}

# Build dependencies - tools needed to build the package
# Note: cmake, ninja, and cxx-compiler are automatically provided by pixi-build-cmake
[package.build-dependencies]
nanobind = ">=2.10.2"
scikit-build-core = ">=1.0.0"
cmake = ">=3.21"
ninja = ">=1.10"
python = ">=3.12"
pytorch = ">=2.13"

# Host dependencies - libraries that will be linked into the package
[package.host-dependencies]
python = ">=3.12"
pytorch = ">=2.13"
nanobind = ">=2.10.2"

# Run dependencies - packages needed at runtime
[package.run-dependencies]
pytorch = ">=2.13"

# Workspace dependencies — default (lean) dev shell: build tools + pytest driver only.
# Retained fixture/interop packages live in `test`; scientific comparators and
# experiment orchestration live in torchsky-harness. See AGENTS.md.
[dependencies]
# torchsky = { path = "." }  # Don't add self-dependency - causes circular dependency
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.15.5,<0.16"
pip = ">=24.0"
psutil = ">=5.9"
scikit-build-core = ">=1.0.0"
cmake = ">=3.21"
ninja = ">=1.10"
nanobind = ">=2.10.2"
pytorch = "==2.13.0"
numpy = ">=1.20"
pre-commit = ">=3.5.0"
twine = ">=5.0"

[tasks]
# Development tasks
dev = "pip install -e . --no-build-isolation"
build = "pixi build"
# Full tests need the `test` env (astropy/pyarrow/polars/…); see AGENTS.md.
test = "KMP_DUPLICATE_LIB_OK=TRUE pixi run -e test -- pytest -n auto --ignore-glob='tests/test_map_*.py'"
lint = "ruff check . && ruff format ."
# Git pre-push hook: ruff + compileall only. Do not add pytest here.
preflight-push = "ruff check . && pixi run -e default -- python -m compileall -q src/torchsky tests"
# Optional local copy of GitHub build-test. Not a push blocker.
ci-local = "pixi run preflight-push && pixi run api-manifest-check && pixi run typecheck && pixi run test"
typecheck = "pixi run -e test pyright"
# Run every example script as a bounded smoke gate.
examples = "pixi run -e test python examples/test_examples.py"
# Documentation site (Zensical + Material theme). See zensical.toml.
docs-build = "bash scripts/sync_docs_examples.sh && pixi run -e docs zensical build --clean --strict"
docs-serve = "pixi run -e docs zensical serve"
docs-links = "pixi run -e docs python scripts/check_docs_links.py"
docs-contract = "pixi run docs-build && pixi run -e docs python scripts/check_docs_links.py --skip-external && pixi run -e test -- pytest tests/test_docs_integrity.py tests/test_docs_snippets.py tests/test_docs_coverage.py -q"
verify = "pixi run -e default -- python scripts/verify_setup.py"

audit-refactor-cohesion = "pixi run -e default -- python scripts/audit_refactor_cohesion.py"
api-manifest = "pixi run -e test -- python scripts/api_manifest.py --write docs/api-manifest.json"
api-manifest-check = "pixi run -e test -- python scripts/api_manifest.py --check docs/api-manifest.json"
setup-hooks = "python scripts/install_hooks.py"
pre-commit = "pre-commit run --all-files"
release-manual = "twine upload dist/*"




# Test phases for development workflow
test-phase1 = "pixi run -e default -- python -c 'import sys; sys.path.insert(0, \"src\"); import torchsky; print(\"Phase 1 COMPLETE: All core features implemented\")'"
test-transforms = "pixi run -e default -- pytest tests/test_transforms.py -v"
test-dataloader = "pixi run -e default -- pytest tests/test_dataloader.py -v"


[feature.prod]
platforms = ["osx-arm64", "linux-64"]

[feature.prod.dependencies]
python = "==3.13.14"

[feature.prod.pypi-dependencies]
torchfits = "==1.0.0"

# Test feature with comparison libraries
[feature.test.dependencies]
astropy = ">=5.0"
fastapi = ">=0.110"
httpx = ">=0.27"
pillow = ">=10.0"
matplotlib = ">=3.8"
pandas = ">=2.2"
polars = ">=1.0"
pyarrow = ">=14.0"
pyright = ">=1.1.350"
pytest-xdist = ">=3.0"
requests = ">=2.28"

# Documentation feature: static site generator for the published docs.
[feature.docs.dependencies]
zensical = ">=0.0.61"

# Benchmark feature with additional dependencies
[feature.cuda]
platforms = ["linux-64-cuda"]

[feature.cuda.dependencies]
python = "==3.13.14"
cuda-nvcc = "13.0.*"
cuda-nvrtc-dev = "13.0.*"
numpy = ">=1.20"
pytest = ">=8.0"
pip = ">=24.0"
scikit-build-core = ">=1.0.0"
cmake = ">=3.21,<4.4"
ninja = ">=1.10"
nanobind = ">=2.10.2"
# PyPI torch's SymPy dependency requires mpmath<1.4; pin the Conda side too.
mpmath = ">=1.1,<1.4"

[feature.cuda.pypi-dependencies]
torchfits = "==1.0.0"
torch = "==2.13.0"

# Production calibration helpers: solve-field plus optional SCAMP refinement.
[feature.astrometry.dependencies]
astromatic-scamp = ">=2.0"
astromatic-source-extractor = ">=2.28"

# Environment definitions
[environments]
default = { features = ["prod"], solve-group = "default" }
test = { features = ["prod", "test"], solve-group = "default" }
cuda-bench = { features = ["cuda"], no-default-feature = true, solve-group = "cuda" }
astrometry = { features = ["prod", "astrometry"], solve-group = "default" }
docs = { features = ["prod", "docs"], solve-group = "default" }
