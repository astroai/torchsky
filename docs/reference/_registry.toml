[[namespace]]
name = "torchsky"
slug = "torchsky"
tier = "core"
related = ["reference/index.md", "introduction/concepts.md"]
intro = "The lean package root. `torchsky.WCS` is the one promoted class; everything else is a domain namespace that loads on first access, so importing the package never pulls in compiled kernels, map models, or optional astronomy packages."

[[module]]
name = "torchsky.sphere.compat"
slug = "sphere-compat"
tier = "compatibility"
related = ["sphere/healpix.md"]
intro = "healpy-shaped HEALPix compatibility layer built on torchsky kernels. Use it when migrating healpy code; prefer the `torchsky.sphere` names for new work."

[[module]]
name = "torchsky.sphere.healpix"
slug = "sphere-healpix"
tier = "core"
related = ["sphere/healpix.md"]
intro = "The torch-native HEALPix kernels: indexing, neighbors, interpolation, queries, reordering, and map sampling. These functions accept and return PyTorch tensors."

[[namespace]]
name = "torchsky.wcs"
slug = "wcs"
tier = "core"
related = ["coordinates/index.md", "coordinates/frames.md", "models/psf-conventions.md"]
intro = "Tensor-native FITS WCS: analytic and distorted projections, SIP/TPV and lookup-table distortions, spectral and time axes, tabular and coupled axes, celestial frames, sampled GWCS detector tables, and astrometric calibration. Every transform accepts and returns `torch.Tensor` and dispatches on the axes present in the header."

