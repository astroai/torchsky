<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="torchsky">
  <g transform="translate(0 0) scale(1.25)">
  <defs>
    <linearGradient id="ts-hero-flame" x1="48" y1="4" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#f18a1f"/>
      <stop offset="1" stop-color="#e2611a"/>
    </linearGradient>
    <clipPath id="ts-hero-bulb">
      <circle cx="48" cy="50" r="15.5"/>
    </clipPath>
  </defs>
  <!-- constellation (the sky the torch lights) -->
  <g stroke="#2b7de9" stroke-width="1.1" stroke-opacity="0.55" fill="none">
    <path d="M12 30 L20 20 L29 25 L26 12"/>
  </g>
  <g fill="#0b1f3a">
    <circle cx="12" cy="30" r="2"/>
    <circle cx="20" cy="20" r="2.3"/>
    <circle cx="26" cy="12" r="1.8"/>
  </g>
  <circle cx="29" cy="25" r="2" fill="#f18a1f"/>
  <!-- flame -->
  <path d="M50 4 C58 14 66 20 66 32 C66 40 60 45 52 46 C57 40 56 33 51 28 C50 34 46 37 42 40 C38 43 37 46 38 48 C32 44 30 38 32 31 C34 23 42 19 46 13 C48 10 49 7 50 4 Z" fill="url(#ts-hero-flame)"/>
  <!-- cone handle -->
  <path d="M36.5 62 L59.5 62 L53 92 L43 92 Z" fill="#0b1f3a"/>
  <g stroke="#ffffff" stroke-width="2.2">
    <path d="M38.6 71 H57.4"/>
    <path d="M40.3 79 H55.7"/>
    <path d="M41.9 86 H54.1"/>
  </g>
  <!-- celestial sphere -->
  <circle cx="48" cy="50" r="17.5" fill="#ffffff"/>
  <circle cx="48" cy="50" r="15.5" fill="#0b1f3a"/>
  <g clip-path="url(#ts-hero-bulb)" fill="none" stroke="#7fb6f5" stroke-opacity="0.75" stroke-width="1.1">
    <ellipse cx="48" cy="50" rx="15.5" ry="5.2"/>
    <ellipse cx="48" cy="50" rx="6.5" ry="15.5"/>
    <path d="M33 42.5 Q48 47 63 42.5"/>
    <path d="M33 57.5 Q48 53 63 57.5"/>
  </g>
  <path d="M48 41.5 L49.9 48.1 L56.5 50 L49.9 51.9 L48 58.5 L46.1 51.9 L39.5 50 L46.1 48.1 Z" fill="#ffffff"/>
  <!-- orbit ring -->
  <path d="M27 57 C20 61 24 66 40 64.5 C55 63 71 57 72 52 C72.6 49 68 48 63 48.8" fill="none" stroke="#2b7de9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="73" cy="51" r="3.4" fill="#f18a1f"/>
  </g>
  <text x="128" y="86" font-family="'Space Grotesk', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="600" letter-spacing="-2">
    <tspan fill="#0b1f3a">torch</tspan><tspan fill="#f18a1f">s</tspan><tspan fill="#2b7de9">ky</tspan>
  </text>
</svg>
