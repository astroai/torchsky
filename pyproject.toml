[build-system]
# Compatible with both pip and pixi-build cmake backend
# When using pixi-build, these are automatically provided but we keep them for pip compatibility
requires = [
    "scikit-build-core>=1.0.0",
    "nanobind>=2.10.2",
    "torch>=2.10,<2.11",
    "numpy>=1.20.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "torchsky"
version = "0.4.0.dev0"
description = "Torch-native sky data, coordinates, geometry, and mapmaking"
authors = [{ name = "Seb Fabbro", email = "sebfabbro@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["fits", "astronomy", "pytorch", "tensor", "wcs", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.15"

# Core runtime dependencies for the library.
# These are automatically managed by pixi for conda packages
# but needed here for PyPI compatibility
dependencies = [
    "torch>=2.10,<2.11",
    "numpy>=1.20.0",  # Core numerical operations
    "torchfits>=1.0.0rc4",
]

[project.urls]
Homepage = "https://github.com/sfabbro/torchsky"
Repository = "https://github.com/sfabbro/torchsky"

[project.scripts]
torchsky = "torchsky.cli:main"

# Defines optional dependencies for different use cases.
# For pixi environments, these are managed separately via features
[project.optional-dependencies]

# Browser-based visualization server: torchsky viz --root /data --port 8822
# Requires internet access for Aladin Lite JS (or a pre-built npm bundle).
viz = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",   # uvloop + httptools for high-throughput PNG streaming
    "pillow>=10.0",              # PNG encoding: tensor → uint8 → PNG bytes
]

dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "ruff>=0.15.5,<0.16",
    "ipykernel",
    "pyright>=1.1.350",
]
bench = [
    "astropy>=5.0",
    "drizzle>=2.2.0",
    "dfreproject>=1.3.0",
    "pandas>=1.0",
    "matplotlib>=3.0",
    "seaborn>=0.11.0",
    "pytest-benchmark>=3.0",
    "pytest-xdist>=3.0",
    "psutil>=5.0",
    "reproject>=0.14",
    "pyarrow>=14.0",
    "polars>=1.0",
]
# Full bench + sphere HEALPix / geometry comparators (same intent as Pixi env `bench-all`).
bench-all = [
    "astropy>=5.0",
    "drizzle>=2.2.0",
    "dfreproject>=1.3.0",
    "pandas>=1.0",
    "matplotlib>=3.0",
    "seaborn>=0.11.0",
    "pytest-benchmark>=3.0",
    "pytest-xdist>=3.0",
    "psutil>=5.0",
    "reproject>=0.14",
    "pyarrow>=14.0",
    "polars>=1.0",
    "healpy>=1.19.0,<2",
    "hpgeom>=1.0",
    "healsparse>=1.10",
    "mocpy>=0.13",
    "astropy-healpix>=1.0",
    "spherical-geometry>=1.2",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-benchmark>=3.0",
    "pytest-xdist>=3.0",
    "psutil>=5.0",
    "scipy>=1.9.0",
    "requests>=2.28.0",
    "polars>=1.0",
    "pyarrow>=14.0",
    "pandas>=2.2",
    "astropy>=5.0",
    "pyright>=1.1.350",
]
examples = [
    "torchvision>=0.15.0",  # For MNIST example
    "requests>=2.28.0",     # For SDSS download example
    "matplotlib>=3.0",      # For visualization in examples
]
# Optional HEALPix SHT peer for benches/tests. healpy remains the science oracle.
# JAX stays out of the default test env; install with pip extra or:
#   pixi run sht-bench-bootstrap
sht-bench = [
    "s2fft>=1.0",
]
# SVO filter profiles + FITS headers for ``torchsky map --method inr`` (default spectral source).
map = [
    "astropy>=5.0",
    "astroquery>=0.4.6",
]
ephem = [
    "jplephem>=2.17",
]
tle = [
    "sgp4>=2.21",
]
gwcs = [
    "gwcs>=0.18",
]

# Configuration for the scikit-build-core build system.
[tool.scikit-build]
# Specifies the directory containing the top-level CMakeLists.txt file.
cmake.source-dir = "src/torchsky/cpp_src"
cmake.build-type = "Release"
cmake.args = [
    "-DTORCHSKY_USE_VENDORED_CFITSIO=ON",
    "-DTORCHSKY_NIOBUF=80",
    "-DTORCHSKY_MINDIRECT=16384",
    "-DUSE_CUDA=OFF",
    # Portable defaults; cpp_src/CMakeLists.txt adds -O3 in Release. Avoid -march=native
    # here so wheels and CI builds are reproducible across machines.
    "-DCMAKE_C_FLAGS=-O3",
    "-DCMAKE_CXX_FLAGS=-O3",
]

# Configures the install directory for the compiled extension.
# This ensures the compiled `cpp.so` or `cpp.pyd` file is placed inside the `torchsky` package.
install.strip = false
wheel.packages = ["src/torchsky"]
sdist.include = ["src/torchsky/sphere/data/pixel_window_functions/*.fits"]

# This setting enables CMake's incremental build feature. When you re-run the build,
# CMake and Ninja will automatically detect which C++ files have changed and only
# recompile those, leading to much faster iteration times.
build-dir = "build/{wheel_tag}"

[[tool.scikit-build.overrides]]
if.platform-system = "^darwin"
cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"




[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:torch.jit._script"]
markers = [
    "performance: performance-oriented benchmark or stress tests",
    "integration: integration tests across multiple modules",
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["E402"]
"tests/test_map_smacs0723_stackers.py" = ["E402"]
"tests/test_map_smacs0723_stackers_band_sweep.py" = ["E402"]
