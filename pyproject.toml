[build-system]
# Compatible with both pip and pixi-build cmake backend
# When using pixi-build, these are automatically provided but we keep them for pip compatibility
requires = [
    "scikit-build-core>=1.0.0",
    "nanobind>=2.10.2",
    "torch>=2.14,<2.15",
    "numpy>=1.20.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "torchsky"
version = "0.5.0rc2"
description = "Torch-native sky data, coordinates, geometry, and mapmaking"
authors = [{ name = "Seb Fabbro", email = "sebfabbro@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "src/torchsky/cpp_src/third_party/pocketfft.LICENSE.md",
]
keywords = ["astronomy", "pytorch", "tensor", "wcs", "healpix", "mapmaking", "coadd", "differentiable", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"

# Core runtime dependencies for the library.
# These are automatically managed by pixi for conda packages
# but needed here for PyPI compatibility
dependencies = [
    "torch>=2.14,<2.15",
    "numpy>=1.20.0",  # Core numerical operations
    "torchfits>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/astroai/torchsky"
Repository = "https://github.com/astroai/torchsky"
Documentation = "https://astroai.github.io/torchsky/"
Changelog = "https://astroai.github.io/torchsky/project/changelog/"
Issues = "https://github.com/astroai/torchsky/issues"

[project.scripts]
torchsky = "torchsky.cli:main"

# Defines optional dependencies for different use cases.
# For pixi environments, these are managed separately via features
[project.optional-dependencies]

# Documentation site build (zensical + Material theme).
docs = [
    "zensical>=0.0.71,<0.1",
    "mkdocstrings-python>=1.16,<2",
]

# Browser-based visualization server: torchsky viz --root /data --port 8822
# Requires internet access for the Aladin Lite JavaScript viewer.
viz = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",   # uvloop + httptools for high-throughput PNG streaming
    "pillow>=10.0",              # PNG encoding: tensor → uint8 → PNG bytes
    "matplotlib>=3.8",           # all-sky and cube figures (torchsky.viz.allsky)
]

dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "ruff>=0.15.5,<0.16",
    "ipykernel",
    "pyright>=1.1.350",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-xdist>=3.0",
    "psutil>=5.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pillow>=10.0",
    "scipy>=1.9.0",
    "requests>=2.28.0",
    "polars>=1.0",
    "pyarrow>=14.0",
    "pandas>=2.2",
    "astropy>=5.0",
    "matplotlib>=3.8",
    "pyright>=1.1.350",
]
examples = [
    "polars>=1.0",
    "pyarrow>=14.0",
    "pandas>=2.2",
    "astropy>=5.0",  # Table interoperability tutorial
]
# SVO filter profiles and FITS headers for spectral-source map runs.
map = [
    "astropy>=5.0",
    "astroquery>=0.4.6",
]
ephem = [
    "jplephem>=2.17",
]
tle = [
    "sgp4>=2.21",
]
gwcs = [
    "gwcs>=0.18",
]

# Configuration for the scikit-build-core build system.
[tool.scikit-build]
# Specifies the directory containing the top-level CMakeLists.txt file.
cmake.source-dir = "src/torchsky/cpp_src"
cmake.build-type = "Release"
# Portable defaults: the extension baseline is scalar on x86_64, with isolated
# AVX2+FMA and arm64 NEON Ishioka leaves selected by runtime capability checks.
# No CFITSIO or CUDA options: the extension is WCS/HEALPix/geometry only.

# Place the compiled `_cpp` extension inside the torchsky package.
install.strip = false
wheel.packages = ["src/torchsky"]

# This setting enables CMake's incremental build feature. When you re-run the build,
# CMake and Ninja will automatically detect which C++ files have changed and only
# recompile those, leading to much faster iteration times.
build-dir = "build/{wheel_tag}"

# The sdist carries sources, C++ kernels, tests, and licenses; repository
# tooling, docs sources, and agent guidance stay out.
[tool.scikit-build.sdist]
include = ["src/torchsky/cpp_src/**", "/LICENSE", "/README.md", "/CMakeLists.txt"]
exclude = [
    ".github/**",
    ".pixi/**",
    ".cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "notes/**",
    "docs/**",
    "examples/**",
    "overrides/**",
    "site/**",
    "build/**",
    "AGENTS.md",
    "CLAUDE.md",
    "pixi.lock",
    "zensical.toml",
]

[[tool.scikit-build.overrides]]
if.platform-system = "^darwin"
cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET = "14.0"




[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:torch.jit._script"]
markers = [
    "performance: performance-oriented benchmark or stress tests",
    "integration: integration tests across multiple modules",
]

[tool.pyright]
include = ["src/torchsky"]
exclude = ["**/__pycache__", "src/torchsky/cpp_src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "All"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
useLibraryCodeForTypes = false
